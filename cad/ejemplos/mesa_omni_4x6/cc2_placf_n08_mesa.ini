# --- printer: Elegoo Centauri Carbon 2 (from sample header) ---
gcode_flavor = klipper
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.8
use_relative_e_distances = 1
machine_limits_usage = ignore
retract_length = 2
retract_speed = 40
deretract_speed = 40
retract_lift = 0
wipe = 0
retract_before_travel = 2
start_gcode = ;===== CC2_START_GCODE (de tu perfil Buddha, temps adaptadas a PLA-CF) =====\nG90\nM104 S150\nM140 S60\nM190 S60 A\nM106 S0\nBED_MESH_CALIBRATE mesh_min=56,62 mesh_max=199,198 ALGORITHM=bicubic PROBE_COUNT=5,5 ADAPTIVE=0 ADAPTIVE_MARGIN=0 FROM_SLICER=1\nM204 S5000\nG28\nM109 S240\nM6211 A1 L200 T0 Q240 R240 S240\nT0\nG180 S7\nG1 X127 Y-1.2 F20000\nG1 Z0.5 F900\nM109 S240\nM83\nG92 E0\nG1 E6 F251.567\nM106 S200\nG1 X87 E20 F6000\nG1 F6000\nG1 X82 E0.8\nM106 S0\nG180 S8\nG1 F20000\nG92 E0
end_gcode = ;===== CC2_END_GCODE (de tu perfil) =====\nM140 S0\nM83\nG92 E0\nG1 E-1.5 F1800\nM106 S0\nG90\nG1 Z80 F20000\nG180 S9\nM104 S0\nM84
before_layer_gcode =
layer_gcode =
thumbnails =

# --- filament: PA-CF @300/90, fan off except bridges 40% (from sample) ---
filament_diameter = 1.75
filament_type = PLA-CF
temperature = 240
first_layer_temperature = 240
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
fan_below_layer_time = 100
slowdown_below_layer_time = 8
disable_fan_first_layers = 1
# --- print: 0.2 mm layers, 3 walls, widths/speeds/accels from sample ---
layer_height = 0.4
first_layer_height = 0.4
perimeters = 3
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = gyroid
extrusion_width = 0.9
first_layer_extrusion_width = 1.0
external_perimeter_extrusion_width = 0.9
perimeter_extrusion_width = 0.9
infill_extrusion_width = 0.9
solid_infill_extrusion_width = 0.9
top_infill_extrusion_width = 0.9
perimeter_speed = 60
external_perimeter_speed = 40
infill_speed = 70
solid_infill_speed = 60
top_solid_infill_speed = 40
bridge_speed = 25
gap_fill_speed = 40
first_layer_speed = 20
travel_speed = 300
default_acceleration = 8000
perimeter_acceleration = 4000
external_perimeter_acceleration = 3000
infill_acceleration = 8000
solid_infill_acceleration = 8000
top_solid_infill_acceleration = 5000
bridge_acceleration = 2500
first_layer_acceleration = 400
travel_acceleration = 8000

# --- user request: no supports, no adhesion helpers ---
support_material = 0
support_material_auto = 0
skirts = 0
skirt_distance = 3
skirt_height = 1
brim_type = outer_only
brim_width = 5
raft_layers = 0
filament_max_volumetric_speed = 24
brim_separation = 0.1
